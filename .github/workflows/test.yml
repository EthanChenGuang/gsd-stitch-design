name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer self-test
        run: bash test/install.test.sh
      - name: Bootstrap into a temporary project
        run: |
          bash -n bootstrap.sh
          proj="$(mktemp -d)"
          git -C "$proj" init -q
          ! bash bootstrap.sh "$proj"   # no GSD here: must refuse
          test ! -e "$proj/.claude/skills"
          bash bootstrap.sh "$proj" --no-autonomous --skip-gsd-check
          test -f "$proj/.claude/skills/gsd-ui-stitch-phase/SKILL.md"
          test -f "$proj/.claude/skills/gsd-ui-design-pick/SKILL.md"
          git -C "$proj" diff --cached --name-only | grep -q gsd-ui-stitch-phase
          test -x "$proj/.claude/hooks/gsd-stitch-design.sh"
          ! grep -qE 'curl|wget' "$proj/.claude/hooks/gsd-stitch-design.sh"   # the hook never downloads
          grep -q gsd-stitch-design.sh "$proj/.claude/settings.json"
          bash bootstrap.sh "$proj" --uninstall
          test ! -e "$proj/.claude/hooks/gsd-stitch-design.sh"
          test ! -e "$proj/.claude/settings.json"
          proj2="$(mktemp -d)"
          git -C "$proj2" init -q
          bash bootstrap.sh "$proj2" --cursor --no-autonomous --skip-gsd-check
          test -f "$proj2/.cursor/skills/gsd-ui-stitch-phase/SKILL.md"
          test -f "$proj2/.cursor/skills/gsd-ui-design-pick/SKILL.md"
          test -x "$proj2/.cursor/bin/gsd-run"
          test -f "$proj2/.cursor/rules/gsd-stitch-design.mdc"
          node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if (!j.mcpServers.Google_Stitch) process.exit(1)' "$proj2/.cursor/mcp.json"
          git -C "$proj2" diff --cached --name-only | grep -q gsd-ui-stitch-phase
          test ! -e "$proj2/.claude/skills"
          bash bootstrap.sh "$proj2" --cursor --uninstall --skip-gsd-check
          test ! -e "$proj2/.cursor/skills/gsd-ui-stitch-phase"
